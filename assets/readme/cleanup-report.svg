<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Windows 360 Cleaner Skill 清理结果示例</title>
  <desc id="desc">删除完成后输出文件、目录、服务、任务、注册表、失败和剩余项目的统计，同时列出默认保护的正常文件。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2238"/>
      <stop offset="1" stop-color="#0b1c2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1440" height="720" rx="36" fill="url(#bg)"/>
  <text x="720" y="66" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">清理结束，不只说“完成”——还会给你一张账单</text>
  <text x="720" y="108" text-anchor="middle" fill="#9fb5cc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19">终端与 Remove JSON 同时记录；Verify 再确认重启后是否复发</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="820" height="500" rx="26" fill="#07111e" stroke="#28506f" stroke-width="2"/>
    <rect x="55" y="145" width="820" height="58" rx="26" fill="#10263b"/>
    <rect x="55" y="177" width="820" height="26" fill="#10263b"/>
    <circle cx="94" cy="174" r="8" fill="#fb7185"/>
    <circle cx="122" cy="174" r="8" fill="#fbbf24"/>
    <circle cx="150" cy="174" r="8" fill="#4ade80"/>
    <text x="187" y="181" fill="#cbd5e1" font-family="Cascadia Mono, Consolas, monospace" font-size="17">Removal summary · 示例</text>

    <text x="92" y="247" fill="#67e8f9" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="700">TotalItemsRemoved</text>
    <text x="445" y="247" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="20">28</text>
    <text x="92" y="289" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">Files / Directories</text>
    <text x="445" y="289" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">17 / 6</text>
    <text x="92" y="331" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">LogicalSizeRemoved</text>
    <text x="445" y="331" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">42.80 MB</text>
    <text x="92" y="373" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">Services removed / pending</text>
    <text x="445" y="373" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">1 / 1</text>
    <text x="92" y="415" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">Tasks / Registry items</text>
    <text x="445" y="415" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">2 / 2</text>
    <text x="92" y="457" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">Skipped / Failed / Pending</text>
    <text x="445" y="457" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">0 / 0 / 1</text>
    <text x="92" y="499" fill="#9fb5cc" font-family="Cascadia Mono, Consolas, Microsoft YaHei, monospace" font-size="19">Retry attempts / unresolved</text>
    <text x="445" y="499" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="19">1 / 0</text>
    <rect x="88" y="535" width="748" height="72" rx="16" fill="#0e2e25" stroke="#22c55e" stroke-opacity="0.6"/>
    <circle cx="129" cy="571" r="20" fill="#22c55e"/>
    <path d="M119 571 L127 579 L141 562" fill="none" stroke="#052e16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="578" fill="#bbf7d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">Verify 后剩余 Confirmed：0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="915" y="145" width="470" height="500" rx="26" fill="url(#panel)" stroke="#275174" stroke-width="2"/>
    <circle cx="1150" cy="222" r="45" fill="#123b5a"/>
    <path d="M1150 190 L1180 203 V224 C1180 246 1167 258 1150 266 C1133 258 1120 246 1120 224 V203 Z" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1135 226 L1146 237 L1167 214" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1150" y="301" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">默认保护的正常内容</text>

    <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">
      <circle cx="968" cy="356" r="15" fill="#22c55e"/><path d="M960 356 L967 363 L978 350" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1000" y="363" fill="#dbeafe">文档、照片和普通 360 数字文件夹</text>
      <circle cx="968" cy="410" r="15" fill="#22c55e"/><path d="M960 410 L967 417 L978 404" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1000" y="417" fill="#dbeafe">驱动、游戏和 Windows 系统屏保</text>
      <circle cx="968" cy="464" r="15" fill="#22c55e"/><path d="M960 464 L967 471 L978 458" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1000" y="471" fill="#dbeafe">浏览器书签和资料（默认保留）</text>
      <circle cx="968" cy="518" r="15" fill="#22c55e"/><path d="M960 518 L967 525 L978 512" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1000" y="525" fill="#dbeafe">其他磁盘的离线 Windows（只扫描）</text>
    </g>

    <rect x="954" y="562" width="392" height="48" rx="16" fill="#122b40"/>
    <text x="1150" y="593" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">证据不足的项目只进入 ReviewOnly</text>
  </g>

  <text x="720" y="688" text-anchor="middle" fill="#7f98b1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">图中数字仅演示输出格式；实际结果以本机生成的 JSON 报告为准</text>
</svg>
